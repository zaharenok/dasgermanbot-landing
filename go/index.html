<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Das German Bot — Open</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #070612; color: rgba(255,255,255,0.9);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 20px;
  }
  .logo { font-size: 64px; margin-bottom: 12px; }
  .title { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { font-size: 15px; color: rgba(255,255,255,0.5); margin-bottom: 28px; max-width: 320px; line-height: 1.5; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #4271FE; color: white; text-decoration: none;
    padding: 18px 56px; border-radius: 14px; font-size: 20px; font-weight: 700;
    box-shadow: 0 8px 32px rgba(66,113,254,0.5);
    border: none; cursor: pointer;
  }
  .btn:active { transform: scale(0.95); }
  #inAppHint { display: none; margin-top: 24px; max-width: 340px; }
  #inAppHint .arrow { font-size: 32px; margin-bottom: 8px; }
  #inAppHint p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  #inAppHint b { color: rgba(255,255,255,0.9); }
  .hint { margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
<div>
  <div class="logo">🥨</div>
  <div class="title">Das German Bot</div>
  <div class="subtitle" id="subtitle"></div>
  <a id="openBtn" class="btn" href="https://t.me/dasgermanbot?start=website"></a>
  <div id="inAppHint">
    <div class="arrow">⋮</div>
    <p id="inAppText"></p>
  </div>
  <div class="hint" id="hint"></div>
</div>
<script>
(function() {
  var t = {
    en: { subtitle: 'Learn German with AI — voice messages, grammar corrections, real conversations.',
          btn: 'Open in Telegram ▸', hint: 'Tap the button to start learning',
          cant_open: 'Can\'t open Telegram?', tap_menu: 'Tap the', menu: '⋮ menu (top right)', then_open: '→', open_in: 'Open in browser', then_tap: 'then tap the button again.' },
    ro: { subtitle: 'Învață germana cu AI — mesaje vocale, corectări gramaticale, conversații reale.',
          btn: 'Deschide în Telegram ▸', hint: 'Atinge butonul pentru a începe',
          cant_open: 'Nu poți deschide Telegram?', tap_menu: 'Atinge', menu: '⋮ meniul (sus dreapta)', then_open: '→', open_in: 'Deschide în browser', then_tap: 'și apoi atinge din nou butonul.' },
    ru: { subtitle: 'Учи немецкий с ИИ — голосовые сообщения, исправления грамматики, реальные диалоги.',
          btn: 'Открыть в Telegram ▸', hint: 'Нажми кнопку, чтобы начать',
          cant_open: 'Не открывается Telegram?', tap_menu: 'Нажми', menu: '⋮ меню (справа сверху)', then_open: '→', open_in: 'Открыть в браузере', then_tap: 'и нажми кнопку снова.' },
    uk: { subtitle: 'Вивчай німецьку з ШІ — голосові повідомлення, виправлення граматики, реальні розмови.',
          btn: 'Відкрити у Telegram ▸', hint: 'Натисни кнопку, щоб почати',
          cant_open: 'Не відкривається Telegram?', tap_menu: 'Натисни', menu: '⋮ меню (праворуч вгорі)', then_open: '→', open_in: 'Відкрити у браузері', then_tap: 'і натисни кнопку знову.' },
    es: { subtitle: 'Aprende alemán con IA — mensajes de voz, correcciones gramaticales, conversaciones reales.',
          btn: 'Abrir en Telegram ▸', hint: 'Toca el botón para empezar',
          cant_open: '¿No abre Telegram?', tap_menu: 'Toca el', menu: '⋮ menú (arriba derecha)', then_open: '→', open_in: 'Abrir en navegador', then_tap: 'y vuelve a tocar el botón.' },
    tr: { subtitle: 'Yapay zeka ile Almanca öğren — sesli mesajlar, dilbilgisi düzeltmeleri, gerçek konuşmalar.',
          btn: 'Telegram\'da Aç ▸', hint: 'Başlamak için düğmeye dokun',
          cant_open: 'Telegram açılmıyor mu?', tap_menu: 'Dokun', menu: '⋮ menü (sağ üst)', then_open: '→', open_in: 'Tarayıcıda aç', then_tap: 've düğmeye tekrar dokun.' },
    fa: { subtitle: 'آلمانی را با هوش مصنوعی یاد بگیر — پیام‌های صوتی، اصلاحات گرامر، مکالمات واقعی.',
          btn: 'باز کردن در تلگرام ▸', hint: 'برای شروع دکمه را بزنید',
          cant_open: 'تلگرام باز نمی‌شود؟', tap_menu: 'لمس کنید', menu: '⋮ منو (بالا راست)', then_open: '→', open_in: 'در مرورگر باز کنید', then_tap: 'سپس دوباره دکمه را بزنید.' },
    ar: { subtitle: 'تعلّم الألمانية بالذكاء الاصطناعي — رسائل صوتية، تصحيح نحوي، محادثات حقيقية.',
          btn: 'افتح في تيليجرام ▸', hint: 'اضغط على الزر للبدء',
          cant_open: 'لا يفتح تيليجرام؟', tap_menu: 'اضغط على', menu: '⋮ القائمة (أعلى اليمين)', then_open: '→', open_in: 'افتح في المتصفح', then_tap: 'ثم اضغط الزر مرة أخرى.' },
    sk: { subtitle: 'Učte sa nemčinu s AI — hlasové správy, opravy gramatiky, reálné konverzácie.',
          btn: 'Otvoriť v Telegram ▸', hint: 'Klepnutím na tlačidlo začnite',
          cant_open: 'Neotvára sa Telegram?', tap_menu: 'Klepnite na', menu: '⋮ menu (vpravo hore)', then_open: '→', open_in: 'Otvoriť v prehliadači', then_tap: 'a potom znova klepnite na tlačidlo.' },
    uz: { subtitle: 'Sun\'iy intellekt bilan nemis tilini o\'rganing — ovozli xabarlar, grammatika tuzatishlari.',
          btn: 'Telegram\'da ochish ▸', hint: 'Boshlash uchun tugmani bosing',
          cant_open: 'Telegram ochilmayaptimi?', tap_menu: 'Bosing', menu: '⋮ menyu (yuqori o\'ng)', then_open: '→', open_in: 'Brauzerda ochish', then_tap: 'va tugmani qayta bosing.' },
    de: { subtitle: 'Lerne Deutsch mit KI — Sprachnachrichten, Grammatikkorrekturen, echte Gespräche.',
          btn: 'In Telegram öffnen ▸', hint: 'Tippe auf die Schaltfläche, um zu starten',
          cant_open: 'Telegram öffnet nicht?', tap_menu: 'Tippe auf', menu: '⋮ Menü (oben rechts)', then_open: '→', open_in: 'Im Browser öffnen', then_tap: 'und tippe erneut auf die Schaltfläche.' }
  };

  function detectLang() {
    var langs = ['ro','ru','uk','es','tr','fa','ar','sk','uz','de','en'];
    var browserLangs = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < browserLangs.length; i++) {
      var code = browserLangs[i].toLowerCase().substring(0, 2);
      if (langs.indexOf(code) !== -1) return code;
    }
    return 'en';
  }

  var lang = detectLang();
  var L = t[lang] || t.en;

  document.getElementById('subtitle').textContent = L.subtitle;
  document.getElementById('openBtn').textContent = L.btn;
  document.getElementById('hint').textContent = L.hint;
  document.getElementById('inAppText').innerHTML =
    '<b>' + L.cant_open + '</b><br>' + L.tap_menu + ' <b>' + L.menu + '</b> ' + L.then_open + ' <b>' + L.open_in + '</b>, ' + L.then_tap;

  if (lang === 'ar' || lang === 'fa') {
    document.documentElement.setAttribute('dir', 'rtl');
  }

  var params = new URLSearchParams(window.location.search);
  var fbclid = params.get('fbclid');

  var startParam = 'website';
  if (fbclid) startParam = 'fbclid_' + fbclid;
  var botUrl = 'https://t.me/dasgermanbot?start=' + encodeURIComponent(startParam);

  var btn = document.getElementById('openBtn');
  btn.href = botUrl;

  var ua = navigator.userAgent || '';
  var inApp = /Instagram|FBAN|FBAV|FBIOS|FBSS|TikTok|Snapchat/i.test(ua);
  if (inApp) {
    document.getElementById('inAppHint').style.display = 'block';
  }

  !function(f,b,e,v,n,t,s){
    if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=true;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)
  }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1445746883270633');

  if (fbclid) {
    document.cookie = '_fbc=fb.1.' + Math.floor(Date.now() / 1000) + '.' + fbclid + '; path=/; max-age=2592000';
  }

  var leadFired = false;
  function fireLead() {
    if (leadFired) return;
    leadFired = true;

    if (typeof confetti === 'function') {
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }

    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }
    var fbp = getCookie('_fbp');
    var fbc = getCookie('_fbc');

    fbq('track', 'Lead', {
      fbp: fbp || undefined, fbc: fbc || undefined, currency: 'EUR', value: 0
    }, { eventID: fbclid || undefined });

    var capiUrl = localStorage.getItem('capi_worker') || 'https://dasgermanbot-capi.olegzakharchenko.workers.dev';
    var capiBody = JSON.stringify({
      event_name: 'Lead', event_id: fbclid || undefined,
      event_time: Math.floor(Date.now() / 1000),
      event_source_url: location.protocol + '//' + location.hostname + location.pathname,
      fbp: fbp || undefined, fbc: fbc || undefined,
      custom_data: { source: 'go_redirect' }
    });
    fetch(capiUrl, { method: 'POST', body: capiBody, headers: { 'Content-Type': 'application/json' }, mode: 'cors' }).catch(function(){});
  }

  btn.addEventListener('click', fireLead);

  setTimeout(function() {
    if (!inApp && !leadFired) {
      fireLead();
      window.location.href = botUrl;
    }
  }, 2000);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="1; url=https://t.me/dasgermanbot?start=website">
</noscript>
</body>
</html>
