<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Das German Bot — Open</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #070612; color: rgba(255,255,255,0.9);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center; padding: 20px;
  }
  .logo { font-size: 64px; margin-bottom: 12px; }
  .title { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { font-size: 15px; color: rgba(255,255,255,0.5); margin-bottom: 28px; max-width: 320px; line-height: 1.5; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #4271FE; color: white; text-decoration: none;
    padding: 18px 56px; border-radius: 14px; font-size: 20px; font-weight: 700;
    box-shadow: 0 8px 32px rgba(66,113,254,0.5);
    border: none; cursor: pointer;
  }
  .btn:active { transform: scale(0.95); }
  #inAppHint { display: none; margin-top: 24px; max-width: 340px; }
  #inAppHint .arrow { font-size: 32px; margin-bottom: 8px; }
  #inAppHint p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  #inAppHint b { color: rgba(255,255,255,0.9); }
  .hint { margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
<div class="logo">🥨</div>
<div class="title">Das German Bot</div>
<div class="subtitle">Learn German with AI — voice messages, grammar corrections, real conversations.</div>
<a id="openBtn" class="btn" href="https://t.me/dasgermanbot?start=website">Open in Telegram ▸</a>
<div id="inAppHint">
  <div class="arrow">⋮</div>
  <p><b>Can't open Telegram?</b><br>Tap the <b>⋮</b> menu (top right) → <b>Open in browser</b> or <b>Open in Safari</b>, then tap the button again.</p>
</div>
<div class="hint">Tap the button to start learning</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var fbclid = params.get('fbclid');

  var startParam = 'website';
  if (fbclid) startParam = 'fbclid_' + fbclid;
  var botUrl = 'https://t.me/dasgermanbot?start=' + encodeURIComponent(startParam);

  var btn = document.getElementById('openBtn');
  btn.href = botUrl;

  /* Detect in-app browser (Instagram, Facebook, TikTok) */
  var ua = navigator.userAgent || '';
  var inApp = /Instagram|FBAN|FBAV|FBIOS|FBSS|TikTok|Snapchat/i.test(ua);
  if (inApp) {
    document.getElementById('inAppHint').style.display = 'block';
  }

  /* Meta Pixel */
  !function(f,b,e,v,n,t,s){
    if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=true;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)
  }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1445746883270633');

  if (fbclid) {
    document.cookie = '_fbc=fb.1.' + Math.floor(Date.now() / 1000) + '.' + fbclid + '; path=/; max-age=2592000';
  }

  /* Fire Lead + attempt redirect after pixel loads.
     Don't auto-redirect in in-app browsers — let user click the button.
     In regular browsers, auto-redirect works fine. */
  setTimeout(function() {
    if (typeof confetti === 'function' && !inApp) {
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }

    function getCookie(name) {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }
    var fbp = getCookie('_fbp');
    var fbc = getCookie('_fbc');

    fbq('track', 'Lead', {
      fbp: fbp || undefined, fbc: fbc || undefined, currency: 'EUR', value: 0
    }, { eventID: fbclid || undefined });

    var capiUrl = localStorage.getItem('capi_worker') || 'https://dasgermanbot-capi.olegzakharchenko.workers.dev';
    var capiBody = JSON.stringify({
      event_name: 'Lead', event_id: fbclid || undefined,
      event_time: Math.floor(Date.now() / 1000),
      event_source_url: location.protocol + '//' + location.hostname + location.pathname,
      fbp: fbp || undefined, fbc: fbc || undefined,
      custom_data: { source: 'go_redirect' }
    });
    fetch(capiUrl, { method: 'POST', body: capiBody, headers: { 'Content-Type': 'application/json' }, mode: 'cors' }).catch(function(){});

    /* Auto-redirect only in regular browsers, NOT in-app */
    if (!inApp) {
      window.location.href = botUrl;
    }
  }, 2000);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="1; url=https://t.me/dasgermanbot?start=website">
</noscript>
</body>
</html>
